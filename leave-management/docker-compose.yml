services:
  postgres:
    image: postgres:16
    container_name: leave_management_db
    environment:
      POSTGRES_DB: leave_management
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGTZ: UTC
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: