services:
  postgres:
    image: postgres:16
    container_name: leave_management_db
    environment:
      POSTGRES_DB: leave_management
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGTZ: UTC
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: leave_management_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/leave_management?options=-c%20TimeZone%3DUTC
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      - postgres

volumes:
  postgres_data: